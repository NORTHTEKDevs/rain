[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rain"
version = "0.0.0"
description = "RAIN — Resonant Active Inference Network (CONFIDENTIAL)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Kristian Baer", email = "info@northtek.io" },
]
keywords = ["proprietary", "patent-pending"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Other Audience",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.13,<2.0",
    "tiktoken>=0.8,<1.0",
    "sentencepiece>=0.2,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "aiohttp>=3.10,<4.0",
    "pydantic>=2.9,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-benchmark>=4.0,<5.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
    "black>=24.0,<25.0",
    "mypy>=1.13,<2.0",
    "maturin>=1.7,<2.0",
    "hypothesis>=6.115,<7.0",
]
bootstrap = [
    "torch>=2.5,<3.0",
    "transformers>=4.48,<5.0",
    "datasets>=3.0,<4.0",
    "sentence-transformers>=3.0,<4.0",
]
eval = [
    "lm-eval>=0.4,<1.0",
]

[project.scripts]
rain = "rain.__main__:main"
rain-cli = "rain_cli.__main__:main"

[project.urls]
homepage = "https://github.com/NORTHTEKDevs/rain"

[tool.maturin]
module-name = "rain._rust"
manifest-path = "rain-rs/Cargo.toml"
features = ["python", "pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "C4", "T20", "SIM", "ARG"]
ignore = ["E501", "S101", "T201"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers -ra"
markers = [
    "slow: deselect with '-m \"not slow\"'",
    "tier1: novelty surface benchmark",
    "tier2: LLM-parity benchmark",
    "tier3: architectural soundness check",
]
