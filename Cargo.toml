[workspace]
resolver = "2"
members = [
    "rain-rs",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kristian Baer <info@northtek.io>"]
license = "Apache-2.0"
repository = "https://github.com/NORTHTEKDevs/rain"
readme = "README.md"

[workspace.dependencies]
# PyO3 + WASM
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
blake3 = "1.5"
bytemuck = { version = "1.19", features = ["derive"] }

# Math
ndarray = { version = "0.16", features = ["serde"] }
nalgebra = "0.33"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"

# Storage (local)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }

# Async
tokio = { version = "1.41", features = ["rt-multi-thread", "macros"] }

# Testing
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
