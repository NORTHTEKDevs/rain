<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RAIN v0 chat</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1a1a1a;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #0A84FF;
    --kb: #4ade80;
    --hymn: #f59e0b;
    --unknown: #ef4444;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 {
    margin: 0; font-size: 16px; font-weight: 600;
  }
  header .health {
    margin-left: auto; font-size: 12px; color: var(--muted);
    font-family: "SF Mono", Menlo, monospace;
  }
  header .health.ok { color: var(--kb); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  .turn { margin-bottom: 18px; }
  .turn .who {
    font-size: 11px; text-transform: uppercase; color: var(--muted);
    letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .turn .body {
    padding: 10px 14px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    white-space: pre-wrap; word-wrap: break-word;
  }
  .turn.user .body { background: #0d1b2c; border-color: #1e3a5f; }
  .turn.rain .body { background: var(--panel-2); }
  .turn.system .body { background: transparent; color: var(--muted); font-style: italic; border: none; padding: 4px 0; }
  .meta {
    margin-top: 6px; font-size: 11px; color: var(--muted);
    font-family: "SF Mono", Menlo, monospace; line-height: 1.4;
  }
  .meta .badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    margin-right: 6px; font-weight: 600;
  }
  .badge.kb { background: rgba(74, 222, 128, 0.15); color: var(--kb); }
  .badge.hymn { background: rgba(245, 158, 11, 0.15); color: var(--hymn); }
  .badge.unknown { background: rgba(239, 68, 68, 0.15); color: var(--unknown); }
  footer {
    padding: 12px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  .input-row { display: flex; gap: 10px; align-items: center; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 8px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border);
    font: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 10px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: white; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; }
  code { font-family: "SF Mono", Menlo, monospace; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>RAIN v0</h1>
  <div class="health" id="health">connecting...</div>
</header>
<main id="log"></main>
<footer>
  <div class="input-row">
    <input id="msg" type="text" placeholder="lion lives_in  |  /tell penguin lives_in antarctica  |  /sample ROMEO:  |  /describe lion" autofocus>
    <button id="send">Send</button>
  </div>
  <div class="hint">
    <code>&lt;subject&gt; &lt;relation&gt;</code> asks the KB; KB-miss falls back to HYMN.
    Commands: <code>/tell s r o</code>, <code>/sample prompt</code>, <code>/describe ent</code>, <code>/judge s r</code>, <code>/tally</code>, <code>/snapshot</code>, <code>/self</code>.
  </div>
</footer>

<script>
const log = document.getElementById('log');
const msgEl = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const healthEl = document.getElementById('health');

function appendTurn(who, body, meta) {
  const div = document.createElement('div');
  div.className = 'turn ' + who;
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
  const b = document.createElement('div'); b.className = 'body'; b.textContent = body;
  div.appendChild(w); div.appendChild(b);
  if (meta) {
    const m = document.createElement('div'); m.className = 'meta'; m.innerHTML = meta;
    div.appendChild(m);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  return r.json();
}
async function get(path) {
  const r = await fetch(path);
  return r.json();
}

async function refreshHealth() {
  try {
    const h = await get('/health');
    const bits = [];
    if (h.has_sampler) bits.push('HYMN');
    if (h.has_judge) bits.push('judge');
    if (h.continual) bits.push('continual');
    healthEl.textContent = `ok · ${bits.join(' · ') || 'KB-only'} · ${Math.round(h.uptime_seconds)}s up`;
    healthEl.classList.add('ok');
  } catch (e) {
    healthEl.textContent = 'unreachable';
    healthEl.classList.remove('ok');
  }
}

function epistemicBadge(epist, source) {
  const tag = source === 'hymn' ? 'hymn' : (epist === 'unknown' ? 'unknown' : 'kb');
  const label = source === 'hymn' ? 'HYMN' : (epist === 'unknown' ? 'unknown' : 'KB');
  return `<span class="badge ${tag}">${label}</span>`;
}

function fmtCites(citations) {
  if (!citations || !citations.length) return '';
  return ' cites: ' + citations.map(c => `(${c.join(', ')})`).join(' ');
}

function fmtCognitive(signals) {
  if (!signals) return '';
  const parts = [];
  if ('cognitive_agreement' in signals) parts.push(`agree ${signals.cognitive_agreement.toFixed(2)}`);
  if ('fep_cos' in signals) parts.push(`FEP-cos ${signals.fep_cos.toFixed(2)}`);
  if ('lsm_state_l2' in signals) parts.push(`LSM-l2 ${signals.lsm_state_l2.toFixed(2)}`);
  if ('tsetlin_max_abs_vote' in signals) parts.push(`Tsetlin-vote ${signals.tsetlin_max_abs_vote.toFixed(0)}`);
  return parts.length ? `<br>cognitive: ${parts.join(' · ')}` : '';
}

async function handleLine(line) {
  if (!line.trim()) return;
  appendTurn('user', line);
  msgEl.value = '';

  try {
    if (line.startsWith('/tell ')) {
      const parts = line.slice(6).trim().split(/\s+/);
      if (parts.length < 3) { appendTurn('system', 'usage: /tell <subject> <relation> <object>'); return; }
      const [s, r, ...rest] = parts;
      const data = await post('/tell', { subject: s, relation: r, object: rest.join('_') });
      appendTurn('rain', `learned: ${JSON.stringify(data.fact)}`);
    }
    else if (line.startsWith('/sample ')) {
      const data = await post('/sample', { prompt: line.slice(8) });
      appendTurn('rain', data.text, `<span class="badge hymn">SAMPLE</span> prompt: ${data.prompt}`);
    }
    else if (line.startsWith('/describe ')) {
      const data = await post('/describe', { entity: line.slice(10).trim() });
      appendTurn('rain', data.text, `<span class="badge kb">DESCRIBE</span>`);
    }
    else if (line.startsWith('/judge ')) {
      const parts = line.slice(7).trim().split(/\s+/);
      if (parts.length < 2) { appendTurn('system', 'usage: /judge <subject> <relation>'); return; }
      const data = await post('/judge', { subject: parts[0], relation: parts.slice(1).join('_') });
      if (data.error) { appendTurn('system', 'error: ' + data.error); return; }
      appendTurn('rain',
        `judge says correct=${data.correct} conf=${data.confidence.toFixed(2)}\nreasoning: ${data.reasoning}\nfeedback fired: ${data.feedback_fired} → calibration[${parts.slice(1).join('_')}]=${data.relation_calibration_after}`);
    }
    else if (line === '/tally') {
      const t = await get('/tally');
      appendTurn('rain', JSON.stringify(t, null, 2));
    }
    else if (line === '/snapshot') {
      const s = await get('/snapshot');
      appendTurn('rain', JSON.stringify(s, null, 2));
    }
    else if (line === '/self') {
      const s = await get('/self');
      appendTurn('rain', s.text);
    }
    else {
      // Parse as <subject> <relation>
      const parts = line.trim().split(/\s+/);
      if (parts.length < 2) {
        // Single token -> sample it as a prompt
        const data = await post('/sample', { prompt: line });
        appendTurn('rain', data.text, `<span class="badge hymn">SAMPLE</span>`);
        return;
      }
      const subject = parts[0];
      const relation = parts.slice(1).join('_');
      const data = await post('/ask', { subject, relation });
      const meta = epistemicBadge(data.epistemic, data.inference_source)
        + `conf ${data.confidence.toFixed(2)} · rel-cal ${data.relation_calibration}`
        + fmtCites(data.citations)
        + fmtCognitive(data.cognitive_signals);
      appendTurn('rain', data.text, meta);
    }
  } catch (e) {
    appendTurn('system', 'error: ' + (e.message || e));
  }
  refreshHealth();
}

sendBtn.addEventListener('click', () => handleLine(msgEl.value));
msgEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleLine(msgEl.value); }
});

refreshHealth();
setInterval(refreshHealth, 10000);
appendTurn('system', 'RAIN v0 chat — try "lion lives_in" or /help-style commands above.');
</script>
</body>
</html>
